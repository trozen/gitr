<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitr</title>
<link rel="stylesheet" href="monaco/editor.css">
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<meta name="theme-color" content="#191a21">
</head>
<body>
<div id="app">
<header id="topbar">
  <button id="crumb" title="Switch project or worktree"><span id="crumb-text">select a worktree</span></button>
  <div id="bar-items">
  <label class="base">base <input id="base" type="search" role="combobox" aria-autocomplete="list" aria-controls="base-list"
    aria-expanded="false" spellcheck="false" size="14" autocomplete="off"
    title="Any branch, tag or commit; click for a list"></label>
  <span id="commit-shown" class="chip" hidden><span id="commit-shown-text"></span><button id="commit-all" class="chip-x" title="Back to all changes (merge base to the working tree)">&#215;</button></span>
  <span id="mergebase" class="dim"></span>
  <!-- notes, in this order; "news" takes the place of "changed" after a reload -->
  <span id="removed" class="chip" hidden>worktree removed</span>
  <span id="changed" class="chip" hidden><span>worktree changed<span id="changed-what"></span></span><button id="reload" class="chip-act">reload</button></span>
  <span id="news" class="chip" hidden><span id="news-text"></span><button id="news-close" class="chip-x" title="Clear the marks of the last reload">&#215;</button></span>
  <span id="outside" class="chip" hidden title="review.json was written by something else (a gitr window, another tab, an agent); the comments it added or edited are flagged"><span id="outside-text"></span><button id="outside-close" class="chip-x" title="Clear the flags">&#215;</button></span>
  <span id="updated" class="chip" hidden title="gitr-serve restarted or its page files changed, so the code running in this page may no longer fit it"><span>app changed</span><button id="reload-page" class="chip-act">reload</button></span>
  <span id="review">
    <span id="ccount" class="dim"></span>
    <span class="nav"><button id="prev-comment" title="Previous comment">&#8593;</button><button id="next-comment" title="Next comment">&#8595;</button></span>
    <button id="copy-agent" title="Copy all comments as text for a coding agent (gitr export prints the same)">copy for agent</button>
    <button id="clear-comments" title="Delete all comments of this worktree (review.json is backed up first)">clear</button>
  </span>
  </div>
</header>

  <div id="sash"></div>
  <main id="main">
    <div id="editor-wrap">
      <div id="editor"></div>
      <div id="progress" hidden></div>
      <div id="cmenu" hidden></div>
      <div id="measure"></div>
    </div>
    <footer id="statusbar"><span id="stats"></span><span class="grow"></span><span id="timing" class="dim"></span></footer>
    <div id="settings" hidden>
      <h2>Font sizes</h2>
      <div id="font-rows"></div>
      <h2>Diff</h2>
      <label class="set-row"><input type="checkbox" id="wrap"> Wrap long lines</label>
      <label class="set-row" title="Show a removed + added pair that differs only in whitespace as one ~ line"><input type="checkbox" id="reindent"> Collapse re-indented lines</label>
      <div class="set-row reload-row">
        <button id="reload-app" title="Load the page again, e.g. after gitr-serve changed">reload the app</button>
      </div>
    </div>
  </main>
</div>
</div>
<div id="basepop" class="pop" hidden><div id="base-list" class="list" role="listbox"></div></div>
<div id="switcher" class="pop" hidden>
  <input id="switch-filter" placeholder="filter by project, branch or folder" spellcheck="false" autocomplete="off">
  <div id="projects" class="list"></div>
</div>
<div id="quickopen" class="pop" hidden>
  <input id="qo-input" type="search" role="combobox" aria-autocomplete="list" aria-controls="qo-list"
    aria-expanded="true" placeholder="Go to a changed file or a worktree by name" spellcheck="false" autocomplete="off">
  <div id="qo-list" class="list" role="listbox"></div>
</div>
<script src="monaco/editor.js"></script>
<script src="app.js"></script>
