id = "gitr"
name = "gitr"
version = "0.2.0"  # gitr's, in pyproject.toml: the plugin runs the gitr next to it
min_herdr_version = "0.9.5"
description = "gitr serve alongside herdr: a review page for the repos open in herdr's panes"
platforms = ["linux"]

# once herdr's server is up; gitr serve stops when herdr's server does
[[startup]]
command = ["python3", "start.py"]

# herdr runs startup hooks only when its server starts, not on install:
# `herdr plugin action invoke start --plugin gitr` starts it now (a running
# gitr serve is left alone)
[[actions]]
id = "start"
title = "Start gitr serve"
contexts = ["workspace"]
command = ["python3", "start.py"]
