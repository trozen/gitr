[build-system]
requires = ["setuptools>=77"]  # license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "gitr"
version = "0.1.0"
description = "Review coding agents' changes: a Git diff viewer in the browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomek Rozen" }]
requires-python = ">=3.10"
keywords = ["git", "diff", "code review", "coding agents", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/trozen/gitr"
Issues = "https://github.com/trozen/gitr/issues"

# For a checkout only (`uv run pytest`); the package itself needs only the
# standard library, and the tests run without pytest too:
# python3 -m unittest discover -s tests -t .
[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
gitr = "gitr:main"

[tool.setuptools]
py-modules = ["gitr"]
packages = ["gitr_web"]

[tool.setuptools.package-data]
gitr_web = ["static/*.html", "static/*.js", "static/*.css", "static/*.webmanifest", "static/icons/*.png",
            "static/monaco/*"]
